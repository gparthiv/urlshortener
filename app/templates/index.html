<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CutURL | URL Shortener</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <link rel="icon" type="image/png" href="app/static/favicon.png">

</head>

<body>

    <div class="container">

        <div class="brand">
            <h1>CutURL</h1>
            <p>Turn your long URL into a short one.</p>
        </div>

        <form id="shorten-form">

            <label for="url-input">Paste your long URL</label>

            <div class="form-row">

                <input
                    type="url"
                    id="url-input"
                    placeholder="https://example.com/your/long/url"
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    id="shorten-button"
                >
                    Shorten URL
                </button>

            </div>

        </form>


        <!-- Loading message -->

        <div
            id="loading"
            class="message loading hidden"
        >
            Creating your shortened URL...
        </div>


        <!-- Error / rate-limit message -->

        <div
            id="error"
            class="message error hidden"
        ></div>


        <!-- Result -->

        <div
            id="result"
            class="result hidden"
        >

            <p class="result-title">
                Your shortened URL
            </p>

            <div class="result-row">

                <input
                    type="text"
                    id="short-url"
                    readonly
                >

                <button
                    type="button"
                    id="copy-button"
                >
                    Copy
                </button>

            </div>

            <a
                id="open-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                class="open-link"
            >
                Open shortened URL →
            </a>

        </div>


        <!-- Theme toggle -->

        <button
            type="button"
            id="theme-toggle"
        >
            Dark Mode
        </button>

    </div>


    <footer>
        Built with Flask · PostgreSQL · Redis · Docker
    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
